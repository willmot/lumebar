name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain Info
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --force-resolved-versions
      - name: Build and package
        run: bash scripts/package-app.sh --no-zip
      - name: Smoke Checks
        run: bash scripts/ci-smoke.sh
